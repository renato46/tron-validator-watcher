name: scan8-190698
on:
  push:
    branches: [probe/scan8-190698]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: portscan8
        run: |
          cat <<'B64' | base64 -d > s8.py

B64
          python3 s8.py
      - name: upload
